{% extends "base.html" %}

{% block title %}ایجاد حساب کاربری{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <!-- اضافه شدن border و border-primary-subtle برای کادر دور فرم -->
        <div class="card border border-2 border-primary-subtle shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <h3 class="text-center fw-bold mb-4 text-primary">ایجاد حساب کاربری</h3>

            <form method="POST" novalidate>
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold">ثبت‌نام در سامانه</button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">قبلاً ثبت‌نام کرده‌اید؟</span>
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary btn-sm rounded-pill ms-2 fw-semibold">
                    ورود به حساب
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
